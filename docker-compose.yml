services:
  postgres:
    image: postgres:16
    container_name: parqueadero-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: parqueadero
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d parqueadero"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: