name: CI - Pruebas del backend

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  pruebas-backend:
    name: Pruebas Java 21 / Maven
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parqueadero
          POSTGRES_USER: parqueadero
          POSTGRES_PASSWORD: ci_password_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parqueadero -d parqueadero"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/parqueadero
      DB_USER: parqueadero
      DB_PASSWORD: ci_password_only

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar codigo del pull request
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Dar permisos al Maven Wrapper
        run: chmod +x ./mvnw

      - name: Ejecutar las pruebas automatizadas
        run: ./mvnw test
